{% extends "app.html" %}
{% block title %}Edit access{% endblock %}
{% block content %}
<p class="small"><a href="{% url 'workspace:team' %}">← Team</a></p>
<div class="page-head"><div><h1>Access for {{ target.user.display_name }}</h1><p>{{ target.user.email }}</p></div></div>
<div class="card card-pad" style="max-width:640px">
  <form method="post">{% csrf_token %}
    {% include "partials/form_fields.html" with form=form %}
    <div class="row"><button class="btn btn-primary" type="submit">Save access</button><a class="btn btn-ghost" href="{% url 'workspace:team' %}">Cancel</a></div>
  </form>
</div>
{% endblock %}

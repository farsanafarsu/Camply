{% comment %}Show/hide button for a password input. Pass input_id. Icons are inline so the button never renders blank.{% endcomment %}
<button type="button" class="password-toggle" data-password-toggle="{{ input_id }}" aria-label="Show password" aria-pressed="false">
  <svg class="pw-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
  <svg class="pw-eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.9 4.2A10.4 10.4 0 0 1 12 4c6.5 0 10 8 10 8a17.6 17.6 0 0 1-2.2 3.2M6.6 6.6C3.8 8.4 2 12 2 12s3.5 7 10 7a9.9 9.9 0 0 0 5.4-1.6M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/></svg>
  <span class="pw-label">Show</span>
</button>

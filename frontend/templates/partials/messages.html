{% if messages %}
<div class="messages" role="status">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}error{% elif message.tags == 'success' %}success{% elif message.tags == 'warning' %}warning{% else %}info{% endif %}">
      <i data-lucide="{% if message.tags == 'error' %}circle-alert{% elif message.tags == 'success' %}circle-check{% else %}info{% endif %}"></i>
      <span>{{ message }}</span>
    </div>
  {% endfor %}
</div>
{% endif %}
